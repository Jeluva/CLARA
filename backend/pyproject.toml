[project]
name = "clara-backend"
version = "0.1.0"
description = "CLARA — backend de análisis de portfolio (FastAPI + medallion)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
